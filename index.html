<style>
:root{
  --paper:#FBFBF9; --ink:#17181A; --grey:#8C8D87; --rule:#E3E2DD; --soft:#F2F2EF;
  --field:#FFFFFF; --late:#A32C1E; --brass:#8A6A2F; --done:#2E6A4F; --shadow:rgba(23,24,26,.10);
  --sans:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --bar:calc(58px + var(--safe-b));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit;background:var(--field);
  border:1px solid var(--rule);border-radius:3px;padding:11px 12px;width:100%;appearance:none}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px}
button:focus-visible,.nav-row:focus-visible,.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea{resize:vertical;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);font-weight:600}
.hidden{display:none!important}

/* ============ ÉCRAN D'OUVERTURE ============ */
#splash{position:fixed;inset:0;z-index:200;background:var(--paper);display:grid;place-items:center;
  transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.splash-in{text-align:center;transform:translateY(-6px)}
.splash-in img{width:132px;height:auto;display:block;margin:0 auto 22px;
  animation:mark .8s cubic-bezier(.2,.7,.2,1) both}
.splash-line{width:0;height:1.5px;background:var(--ink);margin:0 auto 14px;
  animation:rule .9s .35s cubic-bezier(.4,0,.1,1) forwards}
.splash-in p{margin:0;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--grey);
  opacity:0;animation:fade .6s .75s forwards}
@keyframes mark{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rule{to{width:148px}}
@keyframes fade{to{opacity:1}}

/* ============ EN-TÊTE ============ */
#app{max-width:820px;margin:0 auto;padding:0 16px calc(var(--bar) + 28px)}
.head{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);
  max-width:820px;margin:0 auto;padding:10px 16px 0}
.head-top{display:flex;align-items:center;gap:11px;padding-bottom:10px}
.head-top img{width:30px;height:30px;object-fit:contain;flex:none}
.head-id{flex:1;min-width:0}
.head-id b{display:block;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-id span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.sync{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grey);flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grey);flex:none}
.dot.on{background:var(--done);box-shadow:0 0 0 0 rgba(46,106,79,.45);animation:pulse 2.4s infinite}
.dot.off{background:var(--late)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(46,106,79,0)}100%{box-shadow:0 0 0 0 rgba(46,106,79,0)}}
.who{border:1px solid var(--rule);border-radius:99px;padding:5px 10px;font-size:11px;font-weight:600;
  letter-spacing:.04em;background:#fff;flex:none;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- fil d'ariane ---- */
.trail{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:0 0 10px;
  scrollbar-width:none;-ms-overflow-style:none}
.trail::-webkit-scrollbar{display:none}
.crumb{flex:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  color:var(--grey);white-space:nowrap;padding:4px 0}
.crumb.now{color:var(--ink)}
.crumb-sep{flex:none;color:var(--rule);font-size:11px}

/* ============ SIGNATURE : LE BANDEAU DE RELEVÉ ============ */
.stage{padding:20px 0 16px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.stage-lvl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);font-weight:600}
.stage h1{font-size:26px;line-height:1.12;margin:7px 0 16px;letter-spacing:-.022em}
.gauge{display:flex;align-items:flex-end;gap:14px}
.gauge-fig{display:flex;align-items:baseline;gap:3px;flex:none}
.gauge-fig b{font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:.9}
.gauge-fig i{font-style:normal;font-size:15px;color:var(--grey);letter-spacing:-.02em}
.gauge-bars{flex:1;padding-bottom:4px}
.gauge-lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--grey);margin-bottom:6px}
.track{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;display:flex}
.track i{display:block;height:3px;transition:width .45s cubic-bezier(.3,.8,.3,1)}
.track i.d{background:var(--ink)}
.track i.c{background:var(--brass)}

/* ============ LISTES DE NAVIGATION ============ */
.sect-head{display:flex;justify-content:space-between;align-items:baseline;
  padding:22px 0 8px;border-bottom:1px solid var(--ink);margin-bottom:2px}
.nav-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:15px 0;border-bottom:1px solid var(--rule)}
.nav-row:active{background:var(--soft)}
.nav-main{flex:1;min-width:0}
.nav-main .t{font-size:15.5px;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere}
.nav-sub{display:flex;align-items:center;gap:8px;margin-top:7px}
.nav-bar{flex:1;max-width:160px;height:2px;background:var(--rule);overflow:hidden}
.nav-bar i{display:block;height:2px;background:var(--ink);transition:width .4s}
.nav-frac{font-size:11px;color:var(--grey);letter-spacing:.04em}
.nav-frac.done{color:var(--done);font-weight:600}
.nav-late{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--late);font-weight:600}
.chev{flex:none;color:var(--rule);font-size:19px;line-height:1}

/* ============ LIGNES DE POINT ============ */
.item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule)}
.tick{width:44px;height:44px;flex:none;border:1.5px solid var(--ink);border-radius:3px;background:#fff;
  display:grid;place-items:center;transition:background .14s,border-color .14s}
.tick svg{width:21px;height:21px;opacity:0;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tick.c{border-color:var(--brass);background:#fff}
.tick.c::after{content:"";width:13px;height:13px;border-radius:2px;background:var(--brass)}
.item.done .tick{background:var(--ink)}
.item.done .tick svg{opacity:1}
.item-body{flex:1;min-width:0}
.item-txt{font-size:15px;overflow-wrap:anywhere}
.item.done .item-txt{color:var(--grey);text-decoration:line-through;text-decoration-thickness:1px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);
  border:1px solid var(--rule);border-radius:2px;padding:2px 7px;white-space:nowrap;background:#fff}
.tag.late{color:var(--late);border-color:var(--late)}
.tag.ent{color:var(--brass);border-color:#E0D5BE}
.tag.p1{color:var(--late);border-color:var(--late);font-weight:600}
.item-foot{display:flex;align-items:center;gap:14px;margin-top:9px}
.item-foot button{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);font-weight:600}
.item-foot .age{font-size:10.5px;letter-spacing:.06em;color:var(--grey);margin-left:auto}
.item-foot .age.late{color:var(--late);font-weight:600}
.thumbs{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.thumb{width:58px;height:58px;border-radius:3px;overflow:hidden;border:1px solid var(--rule);
  background:var(--soft);flex:none;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:grid;place-items:center;border-style:dashed;color:var(--grey);font-size:19px}
.thumb .up{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,251,249,.86);
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);font-weight:600}
.path-line{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-bottom:5px}

.empty{color:var(--grey);font-size:14px;padding:26px 0;line-height:1.6}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ============ BOUTONS ============ */
.btn{display:block;width:100%;text-align:center;border:1px solid var(--ink);border-radius:3px;
  padding:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:#fff}
.btn.solid{background:var(--ink);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--grey)}
.btn:active{opacity:.7}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}
.addbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + 14px);z-index:35;
  background:var(--ink);color:#fff;border-radius:99px;padding:13px 22px;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;box-shadow:0 6px 22px var(--shadow);display:flex;gap:8px;align-items:center}

/* ============ BARRE D'ONGLETS ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(251,251,249,.94);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--rule);display:flex;padding-bottom:var(--safe-b)}
.tabbar button{flex:1;padding:9px 2px 8px;display:grid;place-items:center;gap:4px;color:var(--grey)}
.tabbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar span{font-size:9.5px;letter-spacing:.06em;font-weight:600}
.tabbar button[aria-selected=true]{color:var(--ink)}
.tabbar button[aria-selected=true] svg{stroke-width:2}

/* ============ FILTRES ============ */
.filters{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--rule);border-radius:99px;padding:7px 13px;font-size:11.5px;
  letter-spacing:.04em;background:#fff;font-weight:500;color:var(--grey)}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ============ FEUILLE MODALE ============ */
.scrim{position:fixed;inset:0;background:rgba(23,24,26,.38);z-index:100;opacity:0;
  transition:opacity .25s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--paper);
  border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(101%);transition:transform .32s cubic-bezier(.3,.9,.3,1);
  box-shadow:0 -8px 40px var(--shadow);padding:0 18px calc(26px + var(--safe-b))}
.sheet.on{transform:none}
.sheet-wrap{max-width:820px;margin:0 auto}
.grab{width:38px;height:4px;border-radius:99px;background:var(--rule);margin:9px auto 4px}
.sheet-head{position:sticky;top:0;background:var(--paper);padding:8px 0 12px;
  border-bottom:1px solid var(--ink);margin-bottom:16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sheet-head h3{font-size:17px}
.sheet-head button{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);font-weight:600}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:5px}
.seg button{flex:1;padding:11px 3px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--grey);font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.c[aria-pressed=true]{background:var(--brass);border-color:var(--brass)}
.seg button.d[aria-pressed=true]{background:var(--done);border-color:var(--done)}

/* ---- fil de commentaires ---- */
.note{padding:11px 0;border-bottom:1px solid var(--rule)}
.note .m{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-bottom:4px}
.note .t{font-size:14px;overflow-wrap:anywhere}

/* ---- journal ---- */
.log{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.log .when{flex:none;width:52px;font-size:10.5px;color:var(--grey);letter-spacing:.02em;padding-top:1px}
.log .what{flex:1;font-size:13.5px;overflow-wrap:anywhere}
.log .what b{font-weight:600}
.log .what em{font-style:normal;color:var(--grey);display:block;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;margin-top:3px}

pre.resume{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;background:#fff;
  border:1px solid var(--rule);border-radius:3px;padding:16px;margin:0;overflow-wrap:anywhere}

/* ---- visionneuse ---- */
.lens{position:fixed;inset:0;z-index:150;background:#0D0E0F;display:none;
  grid-template-rows:auto 1fr auto;color:#fff}
.lens.on{display:grid}
.lens img{max-width:100%;max-height:100%;object-fit:contain;margin:auto;display:block}
.lens-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.lens-bar button{color:#fff;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.lens-bar .rm{color:#E58379}
.lens-body{overflow:hidden;display:grid;padding:0 10px}

.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 74px);transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;
  opacity:0;pointer-events:none;transition:.22s;z-index:160;box-shadow:0 6px 22px var(--shadow);
  max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ============ ACCUEIL / RÉGLAGES ============ */
.gate{max-width:440px;margin:0 auto;padding:56px 20px calc(60px + var(--safe-b))}
.gate img{width:104px;display:block;margin:0 auto 26px}
.gate h2{font-size:20px;text-align:center;margin-bottom:8px}
.gate p{color:var(--grey);font-size:13.5px;text-align:center;margin:0 0 26px;line-height:1.6}
.gate .btn{margin-top:16px}
.note-sm{font-size:11.5px;color:var(--grey);line-height:1.6;margin-top:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);font-size:14px}
.kv span{color:var(--grey)}

@media (min-width:700px){
  .stage h1{font-size:32px}
  .item{padding:16px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
  .splash-line{width:148px}.splash-in p{opacity:1}}
@media print{.head,.tabbar,.addbar,.filters,.item-foot,.tick,.btn-row{display:none!important}
  #app{padding:0;max-width:none}pre.resume{border:none;padding:0}}
</style>

function $(id){ return document.getElementById(id); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function dfr(s){ if(!s) return ""; var d=new Date(s+"T12:00:00");
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function jours(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5); }
function heure(ts){ var d=new Date(ts), n=new Date();
  if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}); }
function toast(m){ var e=$("toast"); e.textContent=m; e.classList.add("on");
  clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove("on")},2200); }
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms||8); }catch(e){} }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k);
  if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }

/* ══════════════════════════════════════════════════════════════
   3 — COUCHE DE DONNÉES  (Firebase Realtime Database ou mode local)
   ══════════════════════════════════════════════════════════════ */
var DB = {
  mode:"local", ready:false, ref:null, storage:null, uid:null, connected:false,
  onItem:null, onItemGone:null, onNote:null, onLog:null, onState:null, onPeers:null
};

function loadScript(src){ return new Promise(function(res,rej){
  var s=document.createElement("script"); s.src=src; s.onload=res;
  s.onerror=function(){ rej(new Error("Chargement impossible : "+src)); };
  document.head.appendChild(s);
}); }

DB.initFirebase = async function(cfg){
  var V="10.12.5", B="https://www.gstatic.com/firebasejs/"+V+"/";
  await loadScript(B+"firebase-app-compat.js");
  await Promise.all([
    loadScript(B+"firebase-auth-compat.js"),
    loadScript(B+"firebase-database-compat.js"),
    loadScript(B+"firebase-storage-compat.js")
  ]);
  firebase.initializeApp(cfg);
  var cred = await firebase.auth().signInAnonymously();
  DB.uid     = cred.user.uid;
  DB.storage = firebase.storage();
  DB.ref     = firebase.database().ref("projets/"+PROJET_ID);
  DB.mode    = "firebase";

  firebase.database().ref(".info/connected").on("value", function(s){
    DB.connected = !!s.val();
    DB.onState && DB.onState(DB.connected);
    if(DB.connected) marquerPresence();
  });

  var it = DB.ref.child("points");
  it.on("child_added",   function(s){ DB.onItem && DB.onItem(s.key, s.val()); });
  it.on("child_changed", function(s){ DB.onItem && DB.onItem(s.key, s.val()); });
  it.on("child_removed", function(s){ DB.onItemGone && DB.onItemGone(s.key); });

  DB.ref.child("notes").on("value", function(s){ DB.onNote && DB.onNote(s.val()||{}); });
  DB.ref.child("journal").limitToLast(80).on("value", function(s){
    var o=s.val()||{}, a=Object.keys(o).map(function(k){ return o[k]; });
    a.sort(function(x,y){ return y.ts-x.ts; }); DB.onLog && DB.onLog(a);
  });
  DB.ref.child("presence").on("value", function(s){
    var o=s.val()||{}, lim=Date.now()-9e5;
    DB.onPeers && DB.onPeers(Object.keys(o).map(function(k){return o[k];}).filter(function(p){return p.ts>lim;}));
  });
  DB.ready = true;
};

function marquerPresence(){
  if(DB.mode!=="firebase") return;
  var p = DB.ref.child("presence/"+DB.uid);
  p.onDisconnect().remove();
  p.set({ nom: MOI.nom, ts: Date.now() });
}

/* ---- mode local : même appareil, synchro entre onglets ---- */
var CANAL = null;
DB.initLocal = function(){
  DB.mode="local"; DB.uid = ls("pg:uid") || (function(){ var u=uid(); ls("pg:uid",u); return u; })();
  DB.connected = true; DB.ready = true;
  try{ CANAL = new BroadcastChannel("pg:"+PROJET_ID);
       CANAL.onmessage = function(){ chargerLocal(); }; }catch(e){}
  chargerLocal();
};
function lireLocal(){ try{ return JSON.parse(ls("pg:data:"+PROJET_ID)||"{}"); }catch(e){ return {}; } }
function ecrireLocal(d){
  try{ localStorage.setItem("pg:data:"+PROJET_ID, JSON.stringify(d)); }
  catch(e){ toast("Mémoire de l'appareil pleine — connectez Firebase pour stocker les photos."); return; }
  try{ CANAL && CANAL.postMessage(1); }catch(e){}
}
function chargerLocal(){
  var d = lireLocal(), pts = d.points||{};
  Object.keys(ITEMS).forEach(function(k){ if(!pts[k]) DB.onItemGone(k); });
  Object.keys(pts).forEach(function(k){ DB.onItem(k, pts[k]); });
  DB.onNote && DB.onNote(d.notes||{});
  var j = d.journal||{}, a = Object.keys(j).map(function(k){return j[k];});
  a.sort(function(x,y){return y.ts-x.ts;}); DB.onLog && DB.onLog(a.slice(0,80));
}

/* ---- écritures ---- */
DB.majPoint = function(id, patch){
  if(DB.mode==="firebase") return DB.ref.child("points/"+id).update(patch);
  var d=lireLocal(); d.points=d.points||{}; var cur=d.points[id]||{};
  Object.keys(patch).forEach(function(k){
    if(k.indexOf("/")<0){ if(patch[k]===null) delete cur[k]; else cur[k]=patch[k]; return; }
    var pa=k.split("/"), o=cur;
    for(var i=0;i<pa.length-1;i++){ o[pa[i]]=o[pa[i]]||{}; o=o[pa[i]]; }
    if(patch[k]===null) delete o[pa[pa.length-1]]; else o[pa[pa.length-1]]=patch[k];
  });
  d.points[id]=cur; ecrireLocal(d); chargerLocal(); return Promise.resolve();
};
DB.creerPoint = function(obj){
  var id = uid();
  if(DB.mode==="firebase"){ DB.ref.child("points/"+id).set(obj); return id; }
  var d=lireLocal(); d.points=d.points||{}; d.points[id]=obj; ecrireLocal(d); chargerLocal(); return id;
};
DB.supprPoint = function(id){
  if(DB.mode==="firebase"){ DB.ref.child("points/"+id).remove(); DB.ref.child("notes/"+id).remove(); return; }
  var d=lireLocal(); if(d.points) delete d.points[id]; if(d.notes) delete d.notes[id];
  ecrireLocal(d); chargerLocal();
};
DB.creerNote = function(itemId, note){
  if(DB.mode==="firebase") return DB.ref.child("notes/"+itemId).push(note);
  var d=lireLocal(); d.notes=d.notes||{}; d.notes[itemId]=d.notes[itemId]||{};
  d.notes[itemId][uid()]=note; ecrireLocal(d); chargerLocal();
};
DB.journal = function(act, txt, ref){
  var e={ ts:Date.now(), qui:MOI.nom, act:act, txt:txt, ref:ref||"" };
  if(DB.mode==="firebase") return DB.ref.child("journal").push(e);
  var d=lireLocal(); d.journal=d.journal||{}; d.journal[uid()]=e;
  var ks=Object.keys(d.journal); if(ks.length>200) ks.slice(0,ks.length-200).forEach(function(k){delete d.journal[k];});
  ecrireLocal(d); chargerLocal();
};
DB.importer = function(lots, cb){
  if(DB.mode==="firebase"){
    var i=0;
    (function suite(){
      if(i>=lots.length){ cb(); return; }
      DB.ref.child("points").update(lots[i++]).then(suite).catch(function(e){ toast("Import interrompu : "+e.message); });
    })();
    return;
  }
  var d=lireLocal(); d.points=d.points||{};
  lots.forEach(function(l){ Object.assign(d.points, l); });
  ecrireLocal(d); chargerLocal(); cb();
};

/* ---- photos ---- */
function compresser(file, max, q){
  max=max||1600; q=q||0.72;
  return new Promise(function(res,rej){
    var fin = function(bmp,w,h){
      var r = Math.min(1, max/Math.max(w,h)),
          c = document.createElement("canvas");
      c.width = Math.round(w*r); c.height = Math.round(h*r);
      c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
      c.toBlob(function(b){ b?res(b):rej(new Error("compression")); },"image/jpeg",q);
    };
    if(window.createImageBitmap){
      createImageBitmap(file,{imageOrientation:"from-image"})
        .then(function(b){ fin(b,b.width,b.height); })
        .catch(function(){ viaImg(); });
    } else viaImg();
    function viaImg(){
      var u=URL.createObjectURL(file), im=new Image();
      im.onload=function(){ fin(im,im.naturalWidth,im.naturalHeight); URL.revokeObjectURL(u); };
      im.onerror=function(){ rej(new Error("image illisible")); };
      im.src=u;
    }
  });
}
DB.envoyerPhoto = async function(itemId, file, onProg){
  var blob = await compresser(file);
  if(DB.mode==="firebase"){
    var chemin = "projets/"+PROJET_ID+"/photos/"+itemId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,6)+".jpg";
    var tache  = DB.storage.ref(chemin).put(blob,{contentType:"image/jpeg"});
    await new Promise(function(res,rej){
      tache.on("state_changed",
        function(s){ onProg && onProg(Math.round(s.bytesTransferred/s.totalBytes*100)); },
        rej, res);
    });
    var url = await tache.snapshot.ref.getDownloadURL();
    return { u:url, p:chemin, ts:Date.now(), qui:MOI.nom };
  }
  var data = await new Promise(function(res){ var r=new FileReader(); r.onload=function(){res(r.result)}; r.readAsDataURL(blob); });
  return { u:data, p:"", ts:Date.now(), qui:MOI.nom };
};
DB.supprPhoto = function(chemin){
  if(DB.mode==="firebase" && chemin){ try{ DB.storage.ref(chemin).delete(); }catch(e){} }
};

var ITEMS = {}, NOTES = {}, LOG = [], PEERS = [];
var MOI = { nom: ls("pg:nom")||"", uid:null };
var V   = { tab:"releve", chemin:[], q:"", filtre:"tous", ent:"" };
var pending = null;

DB.onItem     = function(id,val){ if(val){ val._id=id; ITEMS[id]=val; } planifier(); };
DB.onItemGone = function(id){ delete ITEMS[id]; planifier(); };
DB.onNote     = function(o){ NOTES=o||{}; planifier(); };
DB.onLog      = function(a){ LOG=a||[]; planifier(); };
DB.onPeers    = function(a){ PEERS=a||[]; planifier(); };
DB.onState    = function(){ planifier(); };

function planifier(){ if(pending) return; pending = requestAnimationFrame(function(){ pending=null; dessiner(); }); }

function liste(){ return Object.keys(ITEMS).map(function(k){ return ITEMS[k]; }); }
function sousArbre(chemin){
  return liste().filter(function(it){
    for(var i=0;i<chemin.length;i++){ if((it[K[i]]||"")!==chemin[i]) return false; }
    return true;
  });
}
function enfants(chemin){
  var d=chemin.length; if(d>=4) return [];
  var m={};
  sousArbre(chemin).forEach(function(it){
    var v=it[K[d]]||""; if(!v) return;
    if(!m[v]) m[v]={nom:v,items:[],ordre:1e9};
    m[v].items.push(it); m[v].ordre=Math.min(m[v].ordre, it.o==null?1e9:it.o);
  });
  var a=Object.keys(m).map(function(k){return m[k];});
  a.sort(function(x,y){ return x.ordre-y.ordre || x.nom.localeCompare(y.nom,"fr"); });
  return a;
}
function pointsIci(chemin){
  var d=chemin.length;
  var a=sousArbre(chemin).filter(function(it){ return d>=4 || !(it[K[d]]||""); });
  a.sort(function(x,y){ return (x.o==null?1e9:x.o)-(y.o==null?1e9:y.o) || (x.ca||0)-(y.ca||0); });
  return a;
}
function bilan(items){
  var b={total:items.length, t:0, c:0, a:0, retard:0}, j=today();
  items.forEach(function(it){
    var s=it.st||"a"; b[s]=(b[s]||0)+1;
    if(s!=="t" && it.delai && it.delai<j) b.retard++;
  });
  return b;
}
function filtrer(items){
  var f=V.filtre, e=V.ent;
  return items.filter(function(it){
    var s=it.st||"a";
    if(f==="ouvert" && s==="t") return false;
    if(f==="traite" && s!=="t") return false;
    if(f==="cours"  && s!=="c") return false;
    if(f==="retard" && !(s!=="t" && it.delai && it.delai<today())) return false;
    if(f==="photo"  && !(it.ph && Object.keys(it.ph).length)) return false;
    if(e && (it.ent||"")!==e) return false;
    return true;
  });
}
function entreprises(){
  var s={}; liste().forEach(function(it){ if(it.ent) s[it.ent]=1; });
  return Object.keys(s).sort(function(a,b){return a.localeCompare(b,"fr");});
}
function cheminTexte(it){
  return [it.b,it.n,it.z,it.s].filter(Boolean).join(" › ");
}

var ROOT = $("root");

function dessiner(){
  if(!DB.ready) return;
  if(!MOI.nom){ ecranNom(); return; }
  var act = document.activeElement,
      memo = act && act.id ? {id:act.id, s:act.selectionStart, e:act.selectionEnd} : null;
  ROOT.innerHTML = enTete() + vue() + barreOnglets();
  if(memo){ var el=$(memo.id); if(el){ el.focus();
    try{ el.setSelectionRange(memo.s,memo.e); }catch(e){} } }
}

function enTete(){

           : (DB.connected ? "Synchro" : "Hors ligne");

  var h = '<div class="head"><div class="head-top">'+
    '<img src="'+LOGO+'" alt="">'+
    '<div class="head-id"><b>'+esc(PROJET_NOM)+'</b><span>'+esc(PROJET_SUB)+'</span></div>'+
    '<div class="sync"><i class="dot '+cls+'"></i>'+etat+pairs+'</div>'+

    '</div>';
  h += '<div class="trail">'+
    '<button class="crumb'+(V.chemin.length?"":" now")+'" data-a="up" data-i="0">Chantier</button>';
  V.chemin.forEach(function(p,i){
    h += '<span class="crumb-sep">/</span><button class="crumb'+(i===V.chemin.length-1?" now":"")+
         '" data-a="up" data-i="'+(i+1)+'">'+esc(p)+'</button>';
  });

}

function barreOnglets(){
  var t=[
    ["releve","Relevé",'<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19.5" cy="18" r="2"/>'],
    ["recherche","Recherche",'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'],
    ["journal","Activité",'<path d="M12 7v5l3.2 2"/><circle cx="12" cy="12" r="8.5"/>'],
    ["resume","Rapport",'<path d="M6 3.5h8l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4M9 13h6M9 16.5h4"/>']
  ];
  return '<nav class="tabbar">'+t.map(function(x){
    return '<button data-a="tab" data-t="'+x[0]+'" aria-selected="'+(V.tab===x[0])+'">'+

function vue(){
  var h='<div id="app">';
  h += V.tab==="releve"    ? vueReleve()
     : V.tab==="recherche" ? vueRecherche()
     : V.tab==="journal"   ? vueJournal()
     :                       vueResume();
  return h+'</div>';
}

/* ---------- jauge de tête ---------- */
function jauge(items){
  var b=bilan(items);
  var pt = b.total? Math.round(b.t/b.total*100):0;
  var pc = b.total? Math.round(b.c/b.total*100):0;
  return '<div class="gauge">'+
    '<div class="gauge-fig"><b class="num">'+pt+'</b><i>%</i></div>'+
    '<div class="gauge-bars">'+
      '<div class="gauge-lbl"><span>'+b.t+(b.t>1?' levés':' levé')+' · '+b.c+' en cours · '+(b.a||0)+' à traiter</span>'+
      (b.retard?'<span style="color:var(--late)">'+b.retard+' en retard</span>':'<span class="num">'+b.total+'</span>')+
      '</div><div class="track"><i class="d" style="width:'+pt+'%"></i><i class="c" style="width:'+pc+'%"></i></div>'+
    '</div></div>';
}

/* ---------- onglet Relevé ---------- */
function vueReleve(){
  if(!liste().length) return vueVide();
  var d = V.chemin.length,
      sous = sousArbre(V.chemin),
      kids = enfants(V.chemin),
      ici  = pointsIci(V.chemin);

  var titre = d? V.chemin[d-1] : PROJET_NOM.split("—")[0].trim();
  var lbl   = d? LVL[d-1] : "Ensemble du chantier";

  var h='<div class="stage"><div class="stage-lvl">'+esc(lbl)+'</div>'+
        '<h1>'+esc(titre)+'</h1>'+jauge(sous)+'</div>';

  if(kids.length){
    h+='<div class="sect-head"><h2 class="eyebrow">'+esc(pluriel(LVL[d]))+'</h2>'+
       '<span class="eyebrow num">'+kids.length+'</span></div>';
    h+=kids.map(function(k){ return ligneNav(k); }).join("");
  }

  if(ici.length){
    h+='<div class="sect-head"><h2 class="eyebrow">Points relevés</h2>'+
       '<span class="eyebrow num">'+ici.length+'</span></div>';
    h+=barreFiltres();
    var f=filtrer(ici);
    h+= f.length ? f.map(ligneItem).join("")
       : '<p class="empty"><b>Rien avec ce filtre.</b>Changez de filtre pour revoir les autres points.</p>';
  }

  if(!kids.length && !ici.length){
    h+='<p class="empty"><b>Aucun point ici.</b>Ajoutez le premier relevé de cette zone.</p>';
  }
  h+='<button class="addbar" data-a="ajouter">+ Ajouter un point</button>';
  return h;
}
function pluriel(m){ return m==="Bloc"?"Blocs":m==="Niveau"?"Niveaux":m==="Zone"?"Zones":"Sous-zones"; }

function ligneNav(k){
  var b=bilan(k.items), p=b.total?Math.round(b.t/b.total*100):0;
  return '<button class="nav-row" data-a="go" data-v="'+esc(k.nom)+'">'+
    '<div class="nav-main"><div class="t">'+esc(k.nom)+'</div><div class="nav-sub">'+
      '<span class="nav-bar"><i style="width:'+p+'%"></i></span>'+
      '<span class="nav-frac num'+(b.t===b.total?" done":"")+'">'+b.t+'/'+b.total+'</span>'+
      (b.retard?'<span class="nav-late">'+b.retard+' en retard</span>':'')+
    '</div></div><span class="chev">›</span></button>';
}

function ligneItem(it, avecChemin){
  var st=it.st||"a", fait=st==="t", j=today();
  var retard = !fait && it.delai && it.delai<j;
  var tags="";
  if(it.prio) tags+='<span class="tag p1">Prioritaire</span>';
  if(it.ent)  tags+='<span class="tag ent">'+esc(it.ent)+'</span>';
  if(it.resp) tags+='<span class="tag">'+esc(it.resp)+'</span>';
  if(it.delai) tags+='<span class="tag'+(retard?" late":"")+'">Délai '+dfr(it.delai)+'</span>';
  if(st==="c") tags+='<span class="tag ent">En cours</span>';

  var ph = it.ph? Object.keys(it.ph):[];
  var vign = ph.slice(0,4).map(function(k){
    return '<button class="thumb" data-a="lens" data-id="'+it._id+'" data-ph="'+k+'">'+
           '<img loading="lazy" src="'+esc(it.ph[k].u)+'" alt=""></button>'; }).join("");
  vign += '<button class="thumb add" data-a="photo" data-id="'+it._id+'" aria-label="Ajouter une photo">+</button>';

  var age = fait ? "Levé le "+dfr((it.ta||"").slice(0,10)||j)
          : (it.ca ? "Ouvert depuis "+Math.max(0,jours(new Date(it.ca).toISOString().slice(0,10), j))+" j" : "");

  return '<div class="item'+(fait?" done":"")+'" data-id="'+it._id+'">'+
    '<button class="tick'+(st==="c"?" c":"")+'" data-a="tick" data-id="'+it._id+'" aria-label="'+(fait?"Rouvrir":"Marquer levé")+'">'+
      '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></button>'+
    '<div class="item-body">'+
      (avecChemin?'<div class="path-line">'+esc(cheminTexte(it))+'</div>':'')+
      '<div class="item-txt">'+esc(it.txt)+'</div>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      '<div class="thumbs">'+vign+'</div>'+
      '<div class="item-foot"><button data-a="ouvrir" data-id="'+it._id+'">Détails</button>'+
        (NOTES[it._id]?'<button data-a="ouvrir" data-id="'+it._id+'">'+Object.keys(NOTES[it._id]).length+' note(s)</button>':'')+
        '<span class="age'+(retard?" late":"")+'">'+age+'</span></div>'+
    '</div></div>';
}

function barreFiltres(){
  var f=[["tous","Tous"],["ouvert","À traiter"],["cours","En cours"],["traite","Levés"],
         ["retard","En retard"],["photo","Avec photo"]];
  var h='<div class="filters">'+f.map(function(x){
    return '<button class="pill" data-a="filtre" data-f="'+x[0]+'" aria-pressed="'+(V.filtre===x[0])+'">'+x[1]+'</button>';
  }).join("");
  entreprises().forEach(function(e){
    h+='<button class="pill" data-a="ent" data-e="'+esc(e)+'" aria-pressed="'+(V.ent===e)+'">'+esc(e)+'</button>';
  });
  return h+'</div>';
}

function vueVide(){
  return '<div class="stage"><div class="stage-lvl">Premier lancement</div><h1>Base vide</h1></div>'+
    '<p class="empty"><b>Aucun point enregistré.</b>Importez le relevé initial ('+SEED.length+
    ' points issus du tableau HPJF), puis chacun pourra le compléter depuis son téléphone.</p>'+
    '<button class="btn solid" data-a="import">Importer le relevé initial</button>'+
    '<div class="btn-row"><button class="btn" data-a="ajouter">Créer un point à la main</button></div>';

/* ---------- onglet Recherche ---------- */
function vueRecherche(){
  return '<div class="stage" style="padding-bottom:12px"><div class="stage-lvl">Recherche</div>'+
    '<h1 style="margin-bottom:14px">Tout le chantier</h1>'+
    '<input id="q" type="search" placeholder="Mot-clé, zone, entreprise…" value="'+esc(V.q)+'" autocomplete="off"></div>'+
    barreFiltres()+'<div id="resultats">'+resultats()+'</div>';
}
function resultats(){
  var q=V.q.trim().toLowerCase();
  var base = filtrer(liste());
  if(q){
    var mots=q.split(/\s+/);
    base = base.filter(function(it){
      var s=((it.txt||"")+" "+cheminTexte(it)+" "+(it.ent||"")+" "+(it.resp||"")).toLowerCase();
      return mots.every(function(m){ return s.indexOf(m)>=0; });
    });
  }
  base.sort(function(a,b){ return (a.b||"").localeCompare(b.b||"","fr",{numeric:true}) || (a.o||0)-(b.o||0); });
  if(!base.length) return '<p class="empty"><b>Aucun résultat.</b>Essayez un mot plus court, ou changez de filtre.</p>';
  var lot=base.slice(0,120);
  return '<div class="sect-head"><h2 class="eyebrow">Résultats</h2><span class="eyebrow num">'+base.length+'</span></div>'+
    lot.map(function(it){ return ligneItem(it,true); }).join("")+
    (base.length>lot.length?'<p class="empty">120 premiers résultats affichés — précisez la recherche.</p>':"");
}

/* ---------- onglet Activité ---------- */
function vueJournal(){
  var h='<div class="stage"><div class="stage-lvl">Activité</div><h1>Dernières modifications</h1>'+
    (PEERS.length?'<p class="note-sm">Connectés : '+PEERS.map(function(p){return esc(p.nom);}).join(", ")+'</p>':'')+
    '</div>';
  if(!LOG.length) return h+'<p class="empty"><b>Rien pour l\'instant.</b>Chaque ajout, levée ou photo apparaîtra ici pour toute l\'équipe.</p>';
  return h+LOG.map(function(e){
    return '<div class="log"><div class="when num">'+heure(e.ts)+'</div>'+
      '<div class="what"><b>'+esc(e.qui)+'</b> '+esc(e.act)+' — '+esc(e.txt)+
      (e.ref?'<em>'+esc(e.ref)+'</em>':'')+'</div></div>';
  }).join("");
}

/* ---------- onglet Rapport ---------- */
function texteRapport(){
  var sous=sousArbre(V.chemin), b=bilan(sous), L=[];
  L.push(PROJET_NOM.toUpperCase());
  L.push(V.chemin.length? V.chemin.join(" / ") : "Ensemble du chantier");
  L.push(new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}));
  L.push("");
  L.push("AVANCEMENT : "+b.t+(b.t>1?" levés":" levé")+" / "+b.total+" points ("+(b.total?Math.round(b.t/b.total*100):0)+" %)");
  L.push("À traiter : "+(b.a||0)+"   En cours : "+b.c+(b.retard?"   En retard : "+b.retard:""));

  var groupes={};
  sous.forEach(function(it){
    if((it.st||"a")==="t") return;
    var k=cheminTexte(it)||"—"; (groupes[k]=groupes[k]||[]).push(it);
  });
  var cles=Object.keys(groupes).sort(function(a,b){return a.localeCompare(b,"fr",{numeric:true});});
  if(cles.length){
    L.push(""); L.push("RESTE À TRAITER");
    cles.forEach(function(k){
      L.push(""); L.push(k.toUpperCase());
      groupes[k].forEach(function(it){
        L.push(" - "+it.txt+
          (it.ent?"  ["+it.ent+"]":"")+
          (it.resp?"  ["+it.resp+"]":"")+
          (it.delai?"  délai "+dfr(it.delai):"")+
          ((it.st||"a")==="c"?"  (en cours)":"")+
          (it.ph&&Object.keys(it.ph).length?"  ("+Object.keys(it.ph).length+" photo)":""));
      });
    });
  }
  var levees=sous.filter(function(it){return (it.st||"a")==="t";});
  if(levees.length){
    L.push(""); L.push("LEVÉS ("+levees.length+")");
    levees.slice(0,80).forEach(function(it){ L.push(" - "+cheminTexte(it)+" : "+it.txt); });
    if(levees.length>80) L.push(" … et "+(levees.length-80)+" autres.");
  }
  return L.join("\n");
}
function vueResume(){
  return '<div class="stage"><div class="stage-lvl">Rapport</div><h1>'+
    esc(V.chemin.length? V.chemin[V.chemin.length-1] : "Ensemble du chantier")+'</h1>'+
    jauge(sousArbre(V.chemin))+'</div>'+
    '<p class="note-sm">Le rapport suit la zone ouverte dans l\'onglet Relevé. Remontez le fil d\'ariane pour élargir.</p>'+
    '<pre class="resume">'+esc(texteRapport())+'</pre>'+
    '<div class="btn-row"><button class="btn solid" data-a="partager">Partager</button>'+
    '<button class="btn" data-a="copier">Copier</button></div>'+
    '<div class="btn-row"><button class="btn" data-a="imprimer">Imprimer</button>'+
    '<button class="btn" data-a="csv">Export CSV</button></div>';
}

function ouvrirFeuille(html){

function fermerFeuille(){
  $("sheet").classList.remove("on"); $("scrim").classList.remove("on");
  setTimeout(function(){ $("scrim").classList.add("hidden"); $("sheetIn").innerHTML=""; },300);
}
function teteFeuille(titre, action){
  return '<div class="sheet-head"><h3>'+esc(titre)+'</h3><button data-a="fermer">'+(action||"Fermer")+'</button></div>';
}
function champ(l,html){ return '<div class="field"><label class="eyebrow">'+esc(l)+'</label>'+html+'</div>'; }
function datalists(){
  return ["b","n","z","s"].map(function(k,i){
    var s={}; liste().forEach(function(it){ if(it[k]) s[it[k]]=1; });
    return '<datalist id="dl'+i+'">'+Object.keys(s).sort(function(a,b){return a.localeCompare(b,"fr",{numeric:true});})
      .map(function(v){return '<option value="'+esc(v)+'">';}).join("")+'</datalist>';
  }).join("")+
  '<datalist id="dle">'+entreprises().map(function(v){return '<option value="'+esc(v)+'">';}).join("")+'</datalist>';
}

/* ---------- fiche d'un point ---------- */
function ouvrirPoint(id){
  var it=ITEMS[id]; if(!it) return;
  var st=it.st||"a";
  var ph=it.ph?Object.keys(it.ph):[];
  var notes=NOTES[id]?Object.keys(NOTES[id]).map(function(k){return NOTES[id][k];}):[];
  notes.sort(function(a,b){return a.ts-b.ts;});

  var h=teteFeuille("Point relevé")+
    '<div class="path-line" style="margin-bottom:14px">'+esc(cheminTexte(it))+'</div>'+
    champ("Description",'<textarea id="fTxt" rows="3">'+esc(it.txt)+'</textarea>')+
    champ("Statut",'<div class="seg" id="fSt">'+
      ['a','c','t'].map(function(s){
        return '<button class="'+(s==="c"?"c":s==="t"?"d":"")+'" data-a="seg" data-st="'+s+'" aria-pressed="'+(st===s)+'">'+ST[s]+'</button>';
      }).join("")+'</div>')+
    '<div class="grid2">'+
      champ("Entreprise",'<input id="fEnt" list="dle" value="'+esc(it.ent||"")+'" placeholder="Lot / société">')+
      champ("Responsable",'<input id="fResp" value="'+esc(it.resp||"")+'" placeholder="Nom">')+
    '</div><div class="grid2">'+
      champ("Délai",'<input id="fDelai" type="date" value="'+esc(it.delai||"")+'">')+
      champ("Priorité",'<div class="seg" id="fPrio"><button data-a="seg" data-p="0" aria-pressed="'+(!it.prio)+'">Normale</button>'+
        '<button data-a="seg" data-p="1" aria-pressed="'+(!!it.prio)+'">Prioritaire</button></div>')+
    '</div>'+
    '<div class="field"><label class="eyebrow">Photos</label><div class="thumbs">'+
      ph.map(function(k){ return '<button class="thumb" data-a="lens" data-id="'+id+'" data-ph="'+k+'">'+
        '<img src="'+esc(it.ph[k].u)+'" alt=""></button>'; }).join("")+
      '<button class="thumb add" data-a="photo" data-id="'+id+'">+</button></div></div>'+
    '<div class="field"><label class="eyebrow">Notes de l\'équipe</label>'+
      (notes.length? notes.map(function(n){
        return '<div class="note"><div class="m">'+esc(n.qui)+' · '+heure(n.ts)+'</div><div class="t">'+esc(n.txt)+'</div></div>';
      }).join("") : '<p class="note-sm" style="margin:0 0 10px">Aucune note.</p>')+
      '<div style="display:flex;gap:8px;margin-top:10px"><input id="fNote" placeholder="Écrire une note…">'+
      '<button class="btn" style="width:auto;padding:11px 16px" data-a="note" data-id="'+id+'">Envoyer</button></div></div>'+
    '<button class="btn solid" data-a="enregistrer" data-id="'+id+'">Enregistrer</button>'+
    '<div class="btn-row"><button class="btn ghost" data-a="supprimer" data-id="'+id+'">Supprimer le point</button></div>'+
    '<p class="note-sm">Créé par '+esc(it.cb||"—")+(it.ca?" le "+heure(it.ca):"")+
      (it.ub?" · dernière modification par "+esc(it.ub):"")+'</p>'+
    datalists();
  ouvrirFeuille(h);
}

/* ---------- ajout ---------- */
var FICHIERS = [];
function ouvrirAjout(){
  FICHIERS=[];
  var c=V.chemin;
  var h=teteFeuille("Nouveau point","Annuler")+
    champ("Description",'<textarea id="aTxt" rows="3" placeholder="Ex. Manque quincaillerie de porte"></textarea>')+
    '<div class="grid2">'+
      champ("Bloc",'<input id="a0" list="dl0" value="'+esc(c[0]||"")+'">')+
      champ("Niveau",'<input id="a1" list="dl1" value="'+esc(c[1]||"")+'">')+
    '</div><div class="grid2">'+
      champ("Zone",'<input id="a2" list="dl2" value="'+esc(c[2]||"")+'">')+
      champ("Sous-zone",'<input id="a3" list="dl3" value="'+esc(c[3]||"")+'">')+
    '</div><div class="grid2">'+
      champ("Entreprise",'<input id="aEnt" list="dle" placeholder="Facultatif">')+
      champ("Responsable",'<input id="aResp" placeholder="Facultatif">')+
    '</div><div class="grid2">'+
      champ("Délai",'<input id="aDelai" type="date">')+
      champ("Priorité",'<div class="seg" id="aPrio"><button data-a="seg" data-p="0" aria-pressed="true">Normale</button>'+
        '<button data-a="seg" data-p="1" aria-pressed="false">Prioritaire</button></div>')+
    '</div>'+
    '<div class="field"><label class="eyebrow">Photos</label><div class="thumbs" id="aPh">'+
      '<button class="thumb add" data-a="photoNouveau">+</button></div></div>'+
    '<button class="btn solid" data-a="creer">Ajouter le point</button>'+datalists();
  ouvrirFeuille(h);
  setTimeout(function(){ var t=$("aTxt"); t&&t.focus(); },330);
}

/* ---------- réglages ---------- */
function ouvrirReglages(){
  var b=bilan(liste());
  var h=teteFeuille("Réglages")+
    champ("Votre nom (affiché à l'équipe)",'<input id="rNom" value="'+esc(MOI.nom)+'">')+
    '<div class="kv"><span>Projet</span><b>'+esc(PROJET_ID)+'</b></div>'+
    '<div class="kv"><span>Mode</span><b>'+(DB.mode==="firebase"?"Firebase — temps réel":"Local (cet appareil)")+'</b></div>'+
    '<div class="kv"><span>Points</span><b class="num">'+b.total+'</b></div>'+
    '<div class="kv"><span>Levés</span><b class="num">'+b.t+'</b></div>'+
    '<div class="kv"><span>Connectés</span><b class="num">'+(PEERS.length||1)+'</b></div>'+
    '<button class="btn solid" style="margin-top:16px" data-a="nom">Enregistrer le nom</button>'+
    '<div class="btn-row"><button class="btn" data-a="csv">Export CSV</button>'+
    '<button class="btn" data-a="json">Sauvegarde JSON</button></div>'+
    (liste().length? '' : '<div class="btn-row"><button class="btn" data-a="import">Importer le relevé initial</button></div>')+
    '<div class="btn-row"><button class="btn ghost" data-a="config">Changer la configuration Firebase</button></div>'+
    '<p class="note-sm">Les modifications sont partagées avec toute l\'équipe en temps réel. '+
    'Hors réseau, elles sont mises en file d\'attente puis envoyées dès le retour de la connexion.</p>';
  ouvrirFeuille(h);
}

/* ══════════════════════════════════════════════════════════════
   7 — ACTIONS
   ══════════════════════════════════════════════════════════════ */
function marquer(id){
  var it=ITEMS[id]; if(!it) return;
  var st=(it.st||"a")==="t" ? "a" : "t";
  buzz(10);
  DB.majPoint(id,{ st:st, ta: st==="t"? new Date().toISOString():null,
    tb: st==="t"? MOI.nom:null, ua:Date.now(), ub:MOI.nom });
  DB.journal(st==="t"?"a levé":"a rouvert", it.txt, cheminTexte(it));
}

function enregistrerPoint(id){
  var it=ITEMS[id]; if(!it) return;
  var st = ($("fSt").querySelector('[aria-pressed=true]')||{}).dataset;
  var patch={
    txt:  $("fTxt").value.trim() || it.txt,
    ent:  $("fEnt").value.trim(),
    resp: $("fResp").value.trim(),
    delai:$("fDelai").value||"",
    prio: $("fPrio").querySelector('[aria-pressed=true]').dataset.p==="1"?1:0,
    st:   st? st.st : (it.st||"a"),
    ua:Date.now(), ub:MOI.nom
  };
  if(patch.st==="t" && (it.st||"a")!=="t"){ patch.ta=new Date().toISOString(); patch.tb=MOI.nom; }
  if(patch.st!=="t"){ patch.ta=null; patch.tb=null; }
  DB.majPoint(id,patch);
  DB.journal("a modifié", patch.txt, cheminTexte(it));
  fermerFeuille(); toast("Point enregistré.");
}

function creerPoint(){
  var txt=$("aTxt").value.trim();
  if(!txt){ toast("Écrivez la description avant d'ajouter."); $("aTxt").focus(); return; }
  var obj={ b:$("a0").value.trim(), n:$("a1").value.trim(), z:$("a2").value.trim(), s:$("a3").value.trim(),
    txt:txt, ent:$("aEnt").value.trim(), resp:$("aResp").value.trim(), delai:$("aDelai").value||"",
    prio:$("aPrio").querySelector('[aria-pressed=true]').dataset.p==="1"?1:0,
    st:"a", o:2e6+Date.now()%1e6, ca:Date.now(), cb:MOI.nom, ua:Date.now(), ub:MOI.nom };
  if(!obj.b){ toast("Indiquez au moins le bloc."); return; }
  var id=DB.creerPoint(obj);
  DB.journal("a ajouté", txt, [obj.b,obj.n,obj.z,obj.s].filter(Boolean).join(" › "));
  var f=FICHIERS.slice(); FICHIERS=[];
  fermerFeuille(); toast("Point ajouté.");
  if(f.length) f.forEach(function(file){ televerser(id,file); });
}

function supprimerPoint(id){
  var it=ITEMS[id]; if(!it) return;
  if(!confirm("Supprimer définitivement ce point ?\n\n"+it.txt)) return;
  if(it.ph) Object.keys(it.ph).forEach(function(k){ DB.supprPhoto(it.ph[k].p); });
  DB.supprPoint(id);
  DB.journal("a supprimé", it.txt, cheminTexte(it));
  fermerFeuille(); toast("Point supprimé.");
}

function ajouterNote(id){
  var i=$("fNote"), t=i.value.trim(); if(!t) return;
  DB.creerNote(id,{ txt:t, qui:MOI.nom, ts:Date.now() });
  DB.journal("a commenté", t, cheminTexte(ITEMS[id]||{}));
  i.value=""; toast("Note envoyée.");
  setTimeout(function(){ ouvrirPoint(id); },260);
}

/* ---------- photos ---------- */
var CIBLE=null;
function demanderPhoto(id){ CIBLE=id; $("cam").value=""; $("cam").click(); }
$("cam").addEventListener("change", function(ev){
  var files=[].slice.call(ev.target.files||[]); if(!files.length) return;
  if(CIBLE==="__nouveau__"){
    FICHIERS=FICHIERS.concat(files);
    var box=$("aPh");
    if(box) files.forEach(function(f){
      var b=document.createElement("span"); b.className="thumb";
      var u=URL.createObjectURL(f); b.innerHTML='<img src="'+u+'" alt="">';
      box.insertBefore(b, box.lastElementChild);
    });
    toast(files.length+" photo(s) jointe(s).");
    return;
  }
  var id=CIBLE; files.forEach(function(f){ televerser(id,f); });
});
async function televerser(id,file){
  toast("Envoi de la photo…");
  try{
    var meta = await DB.envoyerPhoto(id, file);
    var cle = "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    var patch={}; patch["ph/"+cle]=meta; patch.ua=Date.now(); patch.ub=MOI.nom;
    await DB.majPoint(id,patch);
    DB.journal("a ajouté une photo", (ITEMS[id]||{}).txt||"", cheminTexte(ITEMS[id]||{}));
    toast("Photo ajoutée.");
  }catch(e){ toast("Photo non envoyée : "+(e.message||e)); }
}

var LENS={id:null,ph:null};
function ouvrirLens(id,ph){
  var it=ITEMS[id]; if(!it||!it.ph||!it.ph[ph]) return;
  LENS={id:id,ph:ph};
  $("lensImg").src=it.ph[ph].u;
  $("lensInfo").textContent=heure(it.ph[ph].ts);
  $("lensBy").textContent=(it.ph[ph].qui||"")+" — "+(it.txt||"").slice(0,60);
  $("lens").classList.add("on");
}
$("lensClose").onclick=function(){ $("lens").classList.remove("on"); $("lensImg").src=""; };
$("lensDel").onclick=function(){
  var it=ITEMS[LENS.id]; if(!it) return;
  if(!confirm("Supprimer cette photo ?")) return;
  DB.supprPhoto(it.ph[LENS.ph].p);
  var patch={}; patch["ph/"+LENS.ph]=null; patch.ua=Date.now(); patch.ub=MOI.nom;
  DB.majPoint(LENS.id,patch);
  $("lens").classList.remove("on"); toast("Photo supprimée.");
};

/* ---------- export ---------- */
function telecharger(nom, contenu, type){
  var b=new Blob([contenu],{type:type||"text/plain;charset=utf-8"}),
      a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=nom; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
function exportCSV(){
  var e=function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
  var L=[["BLOC","NIVEAU","ZONE","SOUS-ZONE","DESCRIPTION","ENTREPRISE","RESPONSABLE","STATUT","DELAI","PHOTOS","LEVE PAR","LEVE LE"].map(e).join(";")];
  liste().sort(function(a,b){return (a.o||0)-(b.o||0);}).forEach(function(it){
    L.push([it.b,it.n,it.z,it.s,it.txt,it.ent,it.resp,ST[it.st||"a"],it.delai,
      it.ph?Object.keys(it.ph).length:0, it.tb||"", it.ta?it.ta.slice(0,10):""].map(e).join(";"));
  });
  telecharger(PROJET_ID+"-elements-manquants-"+today()+".csv","\ufeff"+L.join("\r\n"),"text/csv;charset=utf-8");
  toast("CSV téléchargé.");
}
function exportJSON(){
  telecharger(PROJET_ID+"-sauvegarde-"+today()+".json",
    JSON.stringify({projet:PROJET_ID,date:new Date().toISOString(),points:ITEMS,notes:NOTES},null,1),
    "application/json");
  toast("Sauvegarde téléchargée.");
}
function importerSeed(){
  if(liste().length && !confirm("La base contient déjà des points. Importer quand même le relevé initial ?")) return;
  var lots=[], cur={}, n=0;
  SEED.forEach(function(r,i){
    cur[uid()]={ b:r[0], n:r[1], z:r[2], s:r[3], txt:r[4], ent:r[5], resp:"", delai:"", prio:0,
      st:"a", o:i, ca:Date.now(), cb:"Relevé initial" };
    if(++n%80===0){ lots.push(cur); cur={}; }
  });
  if(Object.keys(cur).length) lots.push(cur);
  toast("Import en cours…");
  DB.importer(lots, function(){
    DB.journal("a importé", SEED.length+" points du relevé initial","");
    toast(SEED.length+" points importés.");
  });
}

/* ══════════════════════════════════════════════════════════════
   8 — ÉCOUTEURS
   ══════════════════════════════════════════════════════════════ */
document.addEventListener("click", function(ev){
  var b=ev.target.closest("[data-a]"); if(!b) return;
  var a=b.dataset.a, id=b.dataset.id;
  switch(a){
    case "tab":      V.tab=b.dataset.t; dessiner(); window.scrollTo(0,0); break;
    case "go":       V.chemin=V.chemin.concat(b.dataset.v); V.filtre="tous"; dessiner(); window.scrollTo(0,0); break;
    case "up":       V.chemin=V.chemin.slice(0,+b.dataset.i); dessiner(); window.scrollTo(0,0); break;
    case "filtre":   V.filtre=b.dataset.f; majListe(); break;
    case "ent":      V.ent = V.ent===b.dataset.e? "" : b.dataset.e; majListe(); break;
    case "tick":     marquer(id); break;
    case "ouvrir":   ouvrirPoint(id); break;
    case "ajouter":  ouvrirAjout(); break;
    case "reglages": ouvrirReglages(); break;
    case "fermer":   fermerFeuille(); break;
    case "enregistrer": enregistrerPoint(id); break;
    case "creer":    creerPoint(); break;
    case "supprimer":supprimerPoint(id); break;
    case "note":     ajouterNote(id); break;
    case "photo":    demanderPhoto(id); break;
    case "photoNouveau": demanderPhoto("__nouveau__"); break;
    case "lens":     ouvrirLens(id,b.dataset.ph); break;
    case "import":   fermerFeuille(); importerSeed(); break;
    case "csv":      exportCSV(); break;
    case "json":     exportJSON(); break;
    case "nom":      var v=$("rNom").value.trim(); if(!v){toast("Indiquez un nom.");return;}
                     MOI.nom=v; ls("pg:nom",v); marquerPresence(); fermerFeuille(); dessiner(); toast("Nom enregistré."); break;
    case "config":   fermerFeuille(); setTimeout(ecranConfig,320); break;
    case "copier":   copier(texteRapport()); break;
    case "imprimer": window.print(); break;
    case "partager":
      var t=texteRapport();
      if(navigator.share) navigator.share({title:PROJET_NOM,text:t}).catch(function(){});
      else copier(t);
      break;
    case "seg":
      [].forEach.call(b.parentElement.children,function(x){ x.setAttribute("aria-pressed", x===b); });
      break;
  }
});
function majListe(){
  var r=$("resultats");
  if(V.tab==="recherche" && r){ r.innerHTML=resultats(); return; }
  dessiner();
}
function copier(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){toast("Rapport copié.")},function(){secours(t)});
  else secours(t);
  function secours(x){ var a=document.createElement("textarea"); a.value=x; document.body.appendChild(a);
    a.select(); try{document.execCommand("copy"); toast("Rapport copié.");}catch(e){toast("Copie impossible.");}
    a.remove(); }
}
document.addEventListener("input", function(ev){
  if(ev.target.id==="q"){ V.q=ev.target.value; var r=$("resultats"); if(r) r.innerHTML=resultats(); }
});
$("scrim").addEventListener("click", fermerFeuille);
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ if($("lens").classList.contains("on")) $("lensClose").click(); else fermerFeuille(); }
});

/* ══════════════════════════════════════════════════════════════
   9 — ÉCRANS D'ENTRÉE
   ══════════════════════════════════════════════════════════════ */
function ecranNom(){
  ROOT.innerHTML='<div class="gate"><img src="'+LOGO+'" alt="Pictogramme">'+
    '<h2>Votre nom</h2><p>Il apparaît à côté de chaque point levé, note et photo, pour que l\'équipe sache qui a fait quoi.</p>'+
    '<input id="gNom" placeholder="Prénom Nom" autocomplete="name">'+
    '<button class="btn solid" id="gOk">Entrer sur le chantier</button></div>';
  $("gNom").focus();
  var val=function(){ var v=$("gNom").value.trim(); if(!v){toast("Indiquez votre nom.");return;}
    MOI.nom=v; ls("pg:nom",v); marquerPresence(); dessiner(); };
  $("gOk").onclick=val;
  $("gNom").onkeydown=function(e){ if(e.key==="Enter") val(); };
}

function ecranConfig(){
  ROOT.innerHTML='<div class="gate"><img src="'+LOGO+'" alt="Pictogramme">'+
    '<h2>Connexion à la base partagée</h2>'+
    '<p>Collez la configuration Firebase du projet. Elle est conservée sur cet appareil : à faire une seule fois par téléphone.</p>'+
    '<textarea id="cCfg" rows="9" placeholder=\'{ "apiKey": "...", "authDomain": "...", "databaseURL": "...", "projectId": "...", "storageBucket": "...", "appId": "..." }\'></textarea>'+
    '<button class="btn solid" id="cOk">Se connecter</button>'+
    '<div class="btn-row"><button class="btn ghost" id="cLocal">Travailler hors ligne sur cet appareil</button></div>'+
    '<p class="note-sm">Hors ligne, les données restent sur ce téléphone et ne sont pas partagées. '+
    'Vous pourrez basculer plus tard sans rien perdre grâce à la sauvegarde JSON.</p></div>';
  $("cOk").onclick=function(){
    var t=$("cCfg").value.trim().replace(/^[^{]*/,"").replace(/;\s*$/,"");
    var cfg; try{ cfg = JSON.parse(t.replace(/(\w+)\s*:/g,'"$1":').replace(/"{2,}/g,'"').replace(/'/g,'"')); }
    catch(e){ toast("Configuration illisible — copiez tout le bloc, accolades comprises."); return; }
    if(!cfg.databaseURL){ toast("Il manque databaseURL (Realtime Database)."); return; }
    ls("pg:cfg",JSON.stringify(cfg)); ls("pg:local",null);
    toast("Connexion…"); demarrer(cfg);
  };
  $("cLocal").onclick=function(){ ls("pg:local","1"); DB.initLocal(); dessiner(); };
}

/* ══════════════════════════════════════════════════════════════
   10 — DÉMARRAGE
   ══════════════════════════════════════════════════════════════ */
function config(){
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) return FIREBASE_CONFIG;
  var s=ls("pg:cfg"); if(s){ try{ return JSON.parse(s); }catch(e){} }
  return null;
}
async function demarrer(cfg){
  try{
    await DB.initFirebase(cfg);
    dessiner();
  }catch(e){
    toast("Connexion impossible : "+(e.message||e));
    ecranConfig();
  }
}
(function boot(){
  var t0=Date.now();
  var fin=function(){
    var reste=Math.max(0, 1250-(Date.now()-t0));
    setTimeout(function(){ $("splash").classList.add("out"); }, reste);
  };
  var cfg=config();
  if(cfg){ demarrer(cfg).then(fin,fin); }
  else if(ls("pg:local")==="1"){ DB.initLocal(); dessiner(); fin(); }
  else { ecranConfig(); fin(); }
  setTimeout(function(){ if(DB.mode==="firebase") marquerPresence(); }, 4000);
  setInterval(function(){ if(DB.mode==="firebase" && DB.connected) marquerPresence(); }, 240000);
})();

})();
</script>
